<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Tamil Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { height: 100vh; background: #18191a; color: #fff; overflow: hidden; }

        /* --- 1. LANDING PAGE --- */
        #landing-page {
            position: fixed; inset: 0; z-index: 100;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .hero-title { font-size: 28px; font-weight: bold; margin: 15px 0 8px; }
        .hero-sub { font-size: 14px; color: #ccc; max-width: 320px; line-height: 1.4; margin-bottom: 25px; }
        
        .btn-green { background: #76b01e; color: white; border: none; padding: 12px 40px; border-radius: 25px; font-weight: bold; font-size: 16px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-dark { background: #242526; color: white; border: 1px solid #3a3b3c; padding: 12px 40px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* --- 2. GUEST LOGIN MODAL --- */
        #login-modal {
            position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-box { background: white; color: #333; width: 100%; max-width: 340px; border-radius: 8px; padding: 20px; position: relative; }
        .close-modal { position: absolute; top: 12px; right: 15px; font-size: 20px; cursor: pointer; color: #666; }
        .modal-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .modal-input { width: 100%; padding: 12px; background: #f0f2f5; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; margin-bottom: 12px; outline: none; }
        
        .captcha-box { border: 1px solid #d3d3d3; background: #f9f9f9; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .captcha-left { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #555; }
        .captcha-left input { width: 20px; height: 20px; }

        .btn-cyan { width: 100%; background: #00a8e8; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* --- 3. MAIN CHAT APP --- */
        #chat-container { display: flex; flex-direction: column; height: 100vh; background: #fff; color: #000; }
        
        /* Top Navigation Bar */
        .top-navbar { background: #242526; color: white; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .nav-right { display: flex; align-items: center; gap: 18px; font-size: 18px; }

        /* Announcement Topic Bar */
        .topic-bar { background: #d1e7dd; color: #0f5132; padding: 10px 15px; font-size: 13px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #badbcc; }

        /* Messages Area */
        #messages-list { flex: 1; overflow-y: auto; padding: 15px; background: #ffffff; display: flex; flex-direction: column; gap: 12px; }
        
        .msg-row { display: flex; gap: 10px; align-items: flex-start; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: #00a8e8; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        
        .msg-content { flex: 1; }
        .msg-header { font-size: 13px; color: #65676b; margin-bottom: 2px; display: flex; justify-content: space-between; }
        .msg-sender { font-weight: bold; color: #050505; }
        .msg-text { font-size: 14px; color: #050505; line-height: 1.4; word-break: break-word; }
        .msg-text img { max-width: 200px; border-radius: 8px; margin-top: 5px; }
        .msg-text audio { max-width: 220px; margin-top: 5px; }

        .system-msg { text-align: center; font-size: 12px; color: #65676b; margin: 5px 0; }

        /* Bottom Input Bar */
        .bottom-bar { padding: 10px 12px; background: #f0f2f5; border-top: 1px solid #e4e6eb; display: flex; align-items: center; gap: 8px; }
        .chat-input { flex: 1; background: white; border: 1px solid #ccc; padding: 10px 15px; border-radius: 20px; font-size: 14px; outline: none; }
        .icon-btn { font-size: 20px; color: #65676b; cursor: pointer; padding: 5px; border: none; background: transparent; }
        .send-btn { font-size: 20px; color: #00a8e8; cursor: pointer; border: none; background: transparent; }
        .recording { color: #e41e3f !important; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- 1. LANDING PAGE -->
    <div id="landing-page">
        <div style="font-size: 50px;">🎉</div>
        <div class="hero-title">Welcome To The Chat</div>
        <div class="hero-sub">Our chat community gives you the opportunity of making new friends and sharing fun moments with other people.</div>
        
        <button class="btn-green" onclick="openLogin()"><i class="fa-solid fa-paper-plane"></i> Login</button>
        <button class="btn-dark" onclick="openLogin()">Guest login</button>
    </div>

    <!-- 2. GUEST LOGIN MODAL -->
    <div id="login-modal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeLogin()">&times;</span>
            <div class="modal-title">Guest login</div>
            
            <input type="text" id="username-input" class="modal-input" placeholder="Username" />
            
            <div class="captcha-box">
                <div class="captcha-left">
                    <input type="checkbox" id="captcha-check" />
                    <label for="captcha-check">I'm not a robot</label>
                </div>
                <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" width="30" alt="captcha"/>
            </div>

            <button class="btn-cyan" onclick="startApp()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        </div>
    </div>

    <!-- 3. MAIN CHAT APP -->
    <div id="chat-container">
        <div class="top-navbar">
            <i class="fa-solid fa-bars" style="font-size: 20px;"></i>
            <div class="nav-right">
                <i class="fa-solid fa-gift" style="color: #ff4757;"></i>
                <i class="fa-solid fa-rotate"></i>
                <i class="fa-solid fa-envelope"></i>
                <i class="fa-solid fa-bell"></i>
                <i class="fa-solid fa-circle-user" style="color: #2ed573;"></i>
            </div>
        </div>

        <div class="topic-bar">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 18px; color: #ffb142;"></i>
            <div><b>Topic:</b> Welcome to Friends Tamil Chat! 🎈 Sharing personal details is at your own risk.</div>
        </div>

        <div id="messages-list">
            <div class="system-msg"><i class="fa-solid fa-triangle-exclamation"></i> Welcome to the Global Chat Room!</div>
        </div>

        <div class="bottom-bar">
            <button class="icon-btn"><i class="fa-regular fa-face-smile"></i></button>
            <button class="icon-btn" onclick="document.getElementById('img-file').click()"><i class="fa-solid fa-camera"></i></button>
            <input type="file" id="img-file" accept="image/*" style="display:none" onchange="sendImage(this)"/>

            <input type="text" id="msg-input" class="chat-input" placeholder="Type here..." onkeypress="handleKey(event)"/>
            
            <button class="icon-btn" id="mic-btn" onclick="toggleRecord()"><i class="fa-solid fa-microphone"></i></button>
            <button class="send-btn" onclick="sendText()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = "";
        let mediaRecorder, audioChunks = [], isRecording = false;

        function openLogin() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeLogin() { document.getElementById('login-modal').style.display = 'none'; }

        function startApp() {
            const name = document.getElementById('username-input').value.trim();
            const captcha = document.getElementById('captcha-check').checked;
            
            if (!name) { alert('Please enter a username!'); return; }
            if (!captcha) { alert('Please check I\'m not a robot!'); return; }

            myUsername = name;
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('login-modal').style.display = 'none';
            
            socket.emit('registerUser', name);
        }

        function handleKey(e) { if (e.key === 'Enter') sendText(); }

        function sendText() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            socket.emit('globalMessage', { sender: myUsername, type: 'text', content: text, time: getCurrentTime() });
            input.value = '';
        }

        function sendImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('globalMessage', { sender: myUsername, type: 'image', content: e.target.result, time: getCurrentTime() });
                }
                reader.readAsDataURL(input.files[0]);
                input.value = '';
            }
        }

        async function toggleRecord() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            socket.emit('globalMessage', { sender: myUsername, type: 'audio', content: e.target.result, time: getCurrentTime() });
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                } catch(err) { alert('Microphone permission needed!'); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        }

        function getCurrentTime() {
            const d = new Date();
            return `${d.getHours()}:${d.getMinutes()<10?'0':''}${d.getMinutes()}`;
        }

        socket.on('receiveGlobalMessage', (data) => {
            const msgList = document.getElementById('messages-list');
            const msgRow = document.createElement('div');
            msgRow.className = 'msg-row';

            let bodyHtml = '';
            if (data.type === 'text') bodyHtml = `<div>${data.content}</div>`;
            else if (data.type === 'image') bodyHtml = `<img src="${data.content}" />`;
            else if (data.type === 'audio') bodyHtml = `<audio controls src="${data.content}"></audio>`;

            const avatarLetter = data.sender ? data.sender.charAt(0).toUpperCase() : 'U';

            msgRow.innerHTML = `
                <div class="avatar">${avatarLetter}</div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span class="msg-sender">${data.sender}</span>
                        <span>${data.time || ''}</span>
                    </div>
                    <div class="msg-text">${bodyHtml}</div>
                </div>
            `;
            msgList.appendChild(msgRow);
            msgList.scrollTop = msgList.scrollHeight;
        });
    </script>
</body>
</html>
