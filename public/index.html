<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerfectChat - Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f0f2f5; }
    
    /* Auth Modal */
    #auth-screen { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .auth-box { background: #fff; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
    .auth-box input, .auth-box select, .auth-box button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; }
    .auth-box button { background: #0084ff; color: #fff; font-weight: bold; cursor: pointer; border: none; }

    /* Web App Layout */
    .sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; background: #0084ff; color: #fff; font-size: 18px; font-weight: bold; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-card { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; cursor: pointer; }
    .user-card:hover { background: #f5f5f5; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
    .online { background: #4CAF50; }
    .offline { background: #9E9E9E; }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #fafafa; }
    .chat-header { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; font-weight: bold; }
    .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 60%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
    .msg-incoming { background: #fff; border: 1px solid #e0e0e0; align-self: flex-start; }
    .msg-outgoing { background: #0084ff; color: #fff; align-self: flex-end; }
    .msg img { max-width: 200px; border-radius: 8px; margin-top: 5px; }

    .input-bar { padding: 12px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
    .input-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .input-bar button { padding: 10px 15px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>Welcome to PerfectChat</h2>
      <input type="text" id="username" placeholder="Enter Username">
      <select id="gender">
        <option value="👨">Male 👨</option>
        <option value="👩">Female 👩</option>
      </select>
      <button onclick="joinChat()">Start Chatting</button>
    </div>
  </div>

  <!-- Main Web Interface -->
  <div class="sidebar">
    <div class="sidebar-header">🌐 PerfectChat Users</div>
    <div class="user-list" id="userList">
      <div class="user-card" onclick="selectRoom('Public')">
        <span class="status-dot online"></span>
        <b>📢 Public Global Chat</b>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="currentRoomTitle">📢 Public Global Chat</div>
    <div class="messages" id="messageBox"></div>
    
    <div class="input-bar">
      <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="sendFile(this)">
      <button onclick="document.getElementById('imageInput').click()">📷</button>
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = "";
    let userGender = "";
    let activeRoom = "Public";

    function joinChat() {
      currentUser = document.getElementById('username').value;
      userGender = document.getElementById('gender').value;
      if (currentUser) {
        document.getElementById('auth-screen').style.display = 'none';
        socket.emit('userJoined', { name: currentUser, gender: userGender });
      }
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      if (input.value) {
        socket.emit('chatMessage', { sender: currentUser, gender: userGender, text: input.value, room: activeRoom });
        input.value = '';
      }
    }

    function sendFile(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          socket.emit('chatMessage', { sender: currentUser, gender: userGender, image: e.target.result, room: activeRoom });
        }
        reader.readAsDataURL(file);
      }
    }

    socket.on('message', data => {
      const box = document.getElementById('messageBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${data.sender === currentUser ? 'msg-outgoing' : 'msg-incoming'}`;
      
      let content = `<b>${data.gender} ${data.sender}:</b><br>`;
      if (data.text) content += data.text;
      if (data.image) content += `<br><img src="${data.image}">`;

      msgDiv.innerHTML = content;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    });

    socket.on('updateUsers', users => {
      const userList = document.getElementById('userList');
      userList.innerHTML = `<div class="user-card" onclick="selectRoom('Public')"><span class="status-dot online"></span><b>📢 Public Global Chat</b></div>`;
      
      users.forEach(u => {
        if(u.name !== currentUser) {
          userList.innerHTML += `
            <div class="user-card">
              <span class="status-dot online"></span>
              ${u.gender} ${u.name}
            </div>`;
        }
      });
    });
  </script>
</body>
</html>
